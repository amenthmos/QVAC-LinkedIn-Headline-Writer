<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>QVAC LinkedIn Headline Writer</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: linear-gradient(160deg, #e8f2ff 0%, #cfe4ff 100%);
    font-family: system-ui, sans-serif; color: #1a2b4a; display: flex; justify-content: center; padding: 46px 20px;
  }
  .wrap { width: 100%; max-width: 520px; }
  h1 { font-size: 1.6rem; margin: 0 0 6px; color: #0a66c2; font-weight: 800; text-align: center; }
  .subtitle { color: #4a5b7c; margin-bottom: 24px; font-size: 0.9rem; text-align: center; }
  .card { background: #fff; border-radius: 16px; padding: 28px 26px; box-shadow: 0 8px 24px rgba(10,102,194,0.12); }
  label { display: block; font-size: 0.85rem; color: #4a5b7c; margin-bottom: 6px; font-weight: 600; }
  input[type=text], textarea {
    width: 100%; padding: 12px 14px; border-radius: 10px; border: 2px solid #b7d3f7;
    font-family: inherit; font-size: 1rem; margin-bottom: 16px;
  }
  textarea { min-height: 70px; resize: vertical; }
  button.action {
    padding: 12px 28px; border: none; border-radius: 999px; font-size: 1rem; font-weight: 700;
    font-family: inherit; cursor: pointer; background: #0a66c2; color: #fff; display: block; margin: 0 auto;
  }
  button.action:disabled { opacity: 0.4; cursor: not-allowed; }
  .status { margin-top: 14px; font-size: 0.85rem; color: #5a6a94; min-height: 1.2em; text-align: center; }
  .result-box {
    margin-top: 20px; padding: 18px; background: #f0f7ff; border-radius: 12px; border: 1px solid #cfe4ff;
    font-size: 1.1rem; font-weight: 700; color: #0a66c2; text-align: center; line-height: 1.5;
  }
  .footer-note { color: #5a6a94; font-size: 0.78rem; margin-top: 20px; text-align: center; }
  .spinner {
    display: inline-block; width: 13px; height: 13px; border: 2px solid #cdd9f7;
    border-top-color: #0a66c2; border-radius: 50%; animation: spin 0.8s linear infinite;
    vertical-align: middle; margin-right: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="wrap">
    <h1>💼 LinkedIn Headline Writer</h1>
    <p class="subtitle">Your role + specifics in, a punchy headline out. 100% on-device.</p>

    <div class="card">
      <label for="roleInput">Your role</label>
      <input type="text" id="roleInput" placeholder="e.g. Product Designer" />
      <label for="strengthsInput">2-3 key strengths or achievements</label>
      <textarea id="strengthsInput" placeholder="e.g. redesigned onboarding flow, boosted signup conversion 25%"></textarea>
      <button class="action" id="generateBtn">Write Headline</button>
      <div class="status" id="status"></div>
      <div id="resultBox"></div>
    </div>

    <p class="footer-note">Everything runs locally on your machine. No text ever leaves this device.</p>
  </div>

  <script>
    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    const roleInput = document.getElementById('roleInput');
    const strengthsInput = document.getElementById('strengthsInput');
    const generateBtn = document.getElementById('generateBtn');
    const status = document.getElementById('status');
    const resultBox = document.getElementById('resultBox');

    async function generate() {
      const role = roleInput.value.trim();
      const strengths = strengthsInput.value.trim();
      if (!role || !strengths) return;
      generateBtn.disabled = true;
      resultBox.innerHTML = '';
      status.innerHTML = '<span class="spinner"></span>Crafting your headline...';

      try {
        const res = await fetch('/api/headline', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ role, strengths }),
        });
        const data = await res.json();
        if (data.error) throw new Error(data.error);

        status.textContent = '';
        resultBox.innerHTML = `<div class="result-box">${escapeHtml(data.headline)}</div>`;
      } catch (err) {
        status.textContent = 'Error: ' + err.message;
      } finally {
        generateBtn.disabled = false;
      }
    }

    generateBtn.addEventListener('click', generate);
  </script>
</body>
</html>
